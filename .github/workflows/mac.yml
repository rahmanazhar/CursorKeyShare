# Optional GitHub Actions pipeline — useful if this repo is mirrored to GitHub
# (GitHub-hosted macOS runners are free for public repos, unlike GitLab's paid
# macOS runners). Builds per-arch DMGs on a tag push.
#
# Secrets for a signed+notarized build (omit for unsigned):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
#   APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: build-mac
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon (use macos-13 for a native x64 host)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:icon
      # Universal (arm64+x64) custom addon so both DMGs get a compatible binary.
      - run: bash scripts/build-native-mac.sh
      - name: Build DMGs (sign + notarize only if a cert secret is present)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            npx electron-builder --mac --arm64 --x64 --publish never -c.mac.notarize.teamId="$APPLE_TEAM_ID"
          else
            echo "Signing cert / Apple credentials incomplete — building unsigned, notarization skipped"
            npx electron-builder --mac --arm64 --x64 --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cursorkeyshare-mac
          path: dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.dmg
